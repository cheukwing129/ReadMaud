<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f8fb"><meta name="description" content="中文延伸閱讀：每天隨機讀一篇，逐段導讀、總結與分析。">
<title>每日一篇｜中文延伸閱讀</title>
<style>
:root{--ink:#17263d;--muted:#64748b;--blue:#2459c4;--blue2:#173e91;--line:#dce4ef;--wash:#f6f8fb;--paper:#fff;--pale:#edf3ff;--gold:#f1bc61;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--wash);color:var(--ink);font-family:var(--sans);line-height:1.7}button,input{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1160px)/2));position:sticky;top:0;z-index:3}.brand{display:flex;gap:11px;align-items:center;color:var(--ink);text-decoration:none;font-weight:750}.mark{display:grid;place-items:center;background:var(--blue);color:#fff;width:35px;height:35px;border-radius:10px 10px 10px 3px;font-family:var(--serif);font-size:19px}.nav{display:flex;gap:24px;align-items:center}.nav a{font-size:14px;color:var(--muted);text-decoration:none}.nav a:hover{color:var(--blue)}main{max-width:1160px;margin:auto;padding:32px 24px 72px}.section-label{font-weight:750;color:var(--blue);font-size:12px;letter-spacing:.14em;margin:0 0 8px}.today{display:grid;grid-template-columns:1.2fr .8fr;gap:38px;background:var(--blue2);color:#fff;border-radius:18px;padding:clamp(26px,5vw,54px);overflow:hidden;position:relative;min-height:320px}.today:after{content:"讀";position:absolute;font-family:var(--serif);font-size:320px;color:rgba(255,255,255,.055);right:6%;top:-112px;pointer-events:none}.today-copy{position:relative;z-index:1;align-self:center}.today .section-label{color:#bcd1ff}.today h1{font:500 clamp(32px,5vw,58px)/1.25 var(--serif);margin:0;max-width:620px}.today-desc{color:#d5e0f7;max-width:540px;margin:14px 0 25px;font-size:16px}.today-meta{font-size:13px;color:#d5e0f7}.buttons{display:flex;flex-wrap:wrap;gap:10px}.btn{border:1px solid transparent;background:#fff;color:var(--blue2);font-weight:700;padding:11px 17px;border-radius:8px}.btn:hover{background:#eaf0fc}.btn.secondary{background:transparent;border-color:#8299c4;color:#fff}.btn.secondary:hover{background:rgba(255,255,255,.1)}.today-aside{position:relative;z-index:1;align-self:center;border-left:1px solid #6682b7;padding:14px 0 14px 26px}.today-aside strong{display:block;font:500 22px var(--serif);margin-bottom:8px}.today-aside p{color:#d5e0f7;font-size:14px;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:38px;margin-top:38px;align-items:start}.reading h2,.library h2{font:500 29px var(--serif);margin:0}.reading-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px;gap:20px}.reading-head p,.library-intro{color:var(--muted);font-size:14px;margin:4px 0 0}.readcard{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:clamp(20px,4vw,36px);box-shadow:0 7px 26px rgba(24,51,93,.045)}.article-head{border-bottom:1px solid var(--line);padding-bottom:19px;margin-bottom:21px}.article-head .author{font-size:13px;color:var(--blue);font-weight:700}.article-head h3{font:500 30px/1.35 var(--serif);margin:5px 0}.article-head p{font-size:14px;color:var(--muted);margin:0}.para{border-left:3px solid #b8caf0;padding:2px 0 3px 18px;margin:22px 0}.original{font:500 20px/1.85 var(--serif);margin:0 0 14px}.analysis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.analysis{background:#f6f8fc;border-radius:9px;padding:12px 13px}.analysis b{display:block;font-size:12px;color:var(--blue);letter-spacing:.04em;margin-bottom:5px}.analysis p{font-size:14px;color:#475569;margin:0;line-height:1.65}.quote{font:500 18px var(--serif);margin:0 0 10px;color:#334155}.translation{margin:0 0 15px;color:#475569}.translation summary{color:var(--blue);font-size:13px;font-weight:700;cursor:pointer}.translation p{margin:8px 0 0;padding:10px 12px;background:#f6f8fc;border-radius:8px;font:16px/1.75 var(--serif)}.tag{display:inline-block;font-size:11px;background:var(--pale);color:var(--blue);padding:3px 8px;border-radius:20px;margin:0 0 5px}.type-chip{display:inline-block;background:#eef3fb;color:#38527e;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;margin:0 0 8px}.notes{margin:0 0 15px;padding:11px 13px;background:#fbf8f0;border-radius:9px}.notes h4{font-size:12px;color:#795a20;margin:0 0 7px}.notes ul{margin:0;padding-left:18px}.notes li{font-size:13px;color:#51515a;margin:4px 0}.notes strong{color:#6b4e18}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:1px 0 10px}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);padding:6px 9px;border-radius:7px;font-size:12px}.filter[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:white}.reader-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.library{position:sticky;top:90px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.library-head{margin-bottom:14px}.search{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;outline:none;margin:13px 0}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2459c41b}.count{font-size:12px;color:var(--muted);margin-bottom:8px}.items{display:flex;flex-direction:column;max-height:510px;overflow:auto}.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;border-top:1px solid #edf0f5;background:#fff;padding:10px 2px;color:var(--ink)}.item:hover{color:var(--blue)}.item.selected{color:var(--blue);font-weight:700}.item-no{font:500 17px var(--serif);color:#8ca2cb;width:28px;flex:none}.item-title{font-size:13px;line-height:1.45}.item small{display:block;color:#8290a3;font-size:11px;margin-top:2px}.not-ready{border:1px dashed #b9c8dc;border-radius:10px;padding:18px;margin:20px 0;background:#f9fbff}.not-ready h4{margin:0 0 4px}.not-ready p{margin:0;color:var(--muted);font-size:14px}.not-ready a{display:inline-block;margin-top:11px;color:var(--blue);font-weight:700;font-size:14px}.progress{height:4px;background:#e7edf6;margin:12px 0}.progress span{display:block;height:100%;background:var(--blue);width:0}.footer{border-top:1px solid var(--line);padding-top:15px;margin-top:36px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:15px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:850px){.layout{grid-template-columns:1fr}.library{position:static}.items{display:grid;grid-template-columns:1fr 1fr;max-height:none;column-gap:15px}.today{grid-template-columns:1fr .55fr;gap:20px}}@media(max-width:600px){.top{height:58px;padding:0 16px}.nav{gap:14px}.nav a{font-size:12px}main{padding:20px 15px 45px}.today{display:block;padding:25px 21px;min-height:0}.today h1{font-size:37px}.today-desc{font-size:14px}.today-aside{border-left:0;border-top:1px solid #6682b7;padding:13px 0 0;margin-top:22px}.today:after{font-size:210px;right:-9px;top:-62px}.layout{margin-top:25px;gap:25px}.reading-head{align-items:start}.reading h2,.library h2{font-size:25px}.readcard{padding:19px 16px}.article-head h3{font-size:25px}.original{font-size:18px}.analysis-grid{grid-template-columns:1fr}.analysis{padding:10px 12px}.items{grid-template-columns:1fr}.footer{display:block}.footer span{display:block;margin-top:5px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#home"><span class="mark">讀</span><span>中文延伸閱讀</span></a><nav class="nav" aria-label="主選單"><a href="#today">今日篇章</a><a href="#library">全部篇章</a></nav></header>
<main id="home">
<section class="today" id="today"><div class="today-copy"><p class="section-label">DAILY READING · 每日一篇</p><h1 id="daily-title">每天讀一篇，<br>慢慢讀出深意。</h1><p class="today-desc" id="daily-desc">今天抽選一篇文章，跟着段落導讀、段意總結與分析，讀懂字句背後的想法。</p><p class="today-meta" id="daily-meta"></p><div class="buttons"><button class="btn" id="start">開始閱讀</button><button class="btn secondary" id="reroll">換一篇</button></div></div><aside class="today-aside"><strong>不再按星期排列</strong><p>每日從已完成逐段導讀的文章中抽選；同一天會看到同一篇。新增完整文章後，會自動加入選讀。</p></aside></section>
<div class="layout"><section class="reading" id="reader"><div class="reading-head"><div><p class="section-label">READ CLOSELY · 逐段細讀</p><h2 id="reader-heading">今日篇章</h2><p>每段附有導讀、段意總結和分析。</p></div></div><article class="readcard" id="article" aria-live="polite"></article></section>
<aside class="library" id="library"><div class="library-head"><p class="section-label">THE COLLECTION</p><h2>篇章庫</h2><p class="library-intro" id="library-intro">新增文章後會在這裡顯示。</p></div><label><span class="sr">搜尋篇章或作者</span><input id="search" class="search" type="search" placeholder="搜尋篇名或作者"></label><div class="filters" role="group" aria-label="按文體分類"><button class="filter" type="button" data-type="all" aria-pressed="true">全部</button><button class="filter" type="button" data-type="classical" aria-pressed="false">文言文</button><button class="filter" type="button" data-type="vernacular" aria-pressed="false">白話文</button></div><div class="count" id="count"></div><div class="items" id="items"></div></aside></div>
<footer class="footer"><div>中文科延伸閱讀 · 每日一篇</div><span>管理者可在 ReadMaud 的 articles.json 新增篇章，毋須修改網頁程式。</span></footer>
</main>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Hong_Kong'});
const storageKey=`readmaud-daily:${dayKey}`;
let articles=[],activeId='';
const label=a=>`${a.author||'作者未填'}：${a.title||'未命名篇章'}`;
const isReady=a=>Boolean(a&&a.title&&a.author&&a.intro&&['classical','vernacular'].includes(a.type)&&Array.isArray(a.paragraphs)&&a.paragraphs.length&&a.paragraphs.every(p=>p&&p.text&&p.guide&&p.summary&&p.analysis&&(a.type!=='classical'||(p.translation&&Array.isArray(p.notes)&&p.notes.length))));
const typeLabel=type=>type==='classical'?'文言文':'白話文';
const readyArticles=()=>articles.filter(isReady);
const safeUrl=value=>{try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?esc(u.href):''}catch{return ''}};
function dateSeed(){return [...dayKey].reduce((n,c)=>((n*31)+c.charCodeAt(0))>>>0,7)}
function activeArticle(){return articles.find(a=>a.id===activeId)||articles[0]}
function render(){
 const a=activeArticle(),complete=readyArticles();
 $('#library-intro').textContent=`${articles.length} 篇 · 完成逐段導讀的文章會加入每日選讀`;
 $('#daily-meta').textContent=`已整理 ${complete.length} 篇 · 篇章庫共 ${articles.length} 篇`;
 $('#reroll').disabled=complete.length<2;
 if(!a){$('#daily-title').textContent='新增第一篇文章';$('#daily-desc').textContent='在 articles.json 加入文章和逐段導讀後，網站便會自動顯示。';$('#reader-heading').textContent='尚未有文章';$('#article').innerHTML='<div class="not-ready"><h4>篇章庫目前是空的</h4><p>新增一篇完整文章後，就會在這裡顯示。</p></div>';return}
 const ready=isReady(a),source=safeUrl(a.sourceUrl),category=a.category?` · ${esc(a.category)}`:'';
 $('#daily-title').textContent=label(a);$('#daily-desc').textContent=ready?a.intro:'這篇文章的逐段內容仍在整理中。完成每段導讀、段意總結和分析後，便會加入每日隨機選讀。';
 $('#reader-heading').textContent=a.title;
 $('#article').innerHTML=ready?`<header class="article-head"><span class="type-chip">${typeLabel(a.type)}</span><span class="author">${esc(a.author)}${category}</span><h3>${esc(a.title)}</h3><p>${esc(a.intro)}</p></header>${a.paragraphs.map((p,i)=>`<section class="para"><span class="tag">第 ${i+1} 段</span><p class="original">${esc(p.text)}</p>${a.type==='classical'&&p.translation?`<details class="translation"><summary>點擊顯示白話譯文</summary><p>${esc(p.translation)}</p></details>`:p.translation?`<p class="quote">譯文｜${esc(p.translation)}</p>`:''}${a.type==='classical'&&p.notes?.length?`<div class="notes"><h4>字詞及句式注釋</h4><ul>${p.notes.map(n=>`<li><strong>${esc(n.term)}</strong>：${esc(n.explanation)}</li>`).join('')}</ul></div>`:''}<div class="analysis-grid"><div class="analysis"><b>導讀</b><p>${esc(p.guide)}</p></div><div class="analysis"><b>段意總結</b><p>${esc(p.summary)}</p></div><div class="analysis"><b>分析</b><p>${esc(p.analysis)}</p></div></div></section>`).join('')}<div class="reader-foot"><span>共 ${a.paragraphs.length} 段 · 建議逐段閱讀</span>${source?`<a href="${source}" target="_blank" rel="noopener">查看原篇章</a>`:''}</div>`:`<header class="article-head"><span class="type-chip">${typeLabel(a.type)}</span><span class="author">篇章庫 · 內容整理中</span><h3>${esc(a.title)}</h3><p>${esc(a.author)}</p></header><div class="not-ready"><h4>逐段導讀整理中</h4><p>這篇文章尚未補齊所需內容；文言文還須填寫每段白話譯文及按語境編寫的字詞／句式注釋。完成後會自動列入每日選讀。</p>${source?`<a href="${source}" target="_blank" rel="noopener">前往原網站閱讀篇章</a>`:''}</div><div class="reader-foot"><span>篇章 ${articles.indexOf(a)+1} / ${articles.length}</span></div>`;
 $('#start').onclick=()=>$('#reader').scrollIntoView({behavior:'smooth'});
}
let activeType='all';
function renderList(){
 const q=$('#search').value.trim().toLowerCase();
 const list=articles.filter(a=>(activeType==='all'||a.type===activeType)&&label(a).toLowerCase().includes(q));
 $('#count').textContent=`顯示 ${list.length} / ${articles.length} 篇`;
 $('#items').innerHTML=list.map(a=>`<button class="item ${activeId===a.id?'selected':''}" type="button" data-id="${esc(a.id)}"><span class="item-no">${String(articles.indexOf(a)+1).padStart(2,'0')}</span><span class="item-title">${esc(label(a))}<small>${typeLabel(a.type)} · ${isReady(a)?'已完成逐段導讀':'內容整理中'}</small></span></button>`).join('');
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{activeId=b.dataset.id;localStorage.setItem(storageKey,activeId);render();renderList();$('#reader').scrollIntoView({behavior:'smooth'})});
}
function showLoadError(){ $('#daily-title').textContent='篇章資料未能載入';$('#daily-desc').textContent='請重新載入頁面；如剛新增了文章，請確認 articles.json 格式正確。';$('#reader-heading').textContent='暫時無法開啟篇章';$('#article').innerHTML='<div class="not-ready"><h4>資料檔讀取失敗</h4><p>請檢查 articles.json 是否為有效 JSON，再重新部署。</p></div>'; }
async function init(){
 try{
  const response=await fetch('./articles.json',{cache:'no-store'});if(!response.ok)throw new Error('articles.json request failed');
  const data=await response.json();if(!Array.isArray(data.articles))throw new Error('articles must be an array');
  articles=data.articles.slice().sort((a,b)=>(a.order??999999)-(b.order??999999));
  const complete=readyArticles(),saved=localStorage.getItem(storageKey);
  const initial=complete.find(a=>a.id===saved)||complete[dateSeed()%Math.max(complete.length,1)]||articles[0];
  activeId=initial?.id||'';
  $('#reroll').addEventListener('click',()=>{const pool=readyArticles().filter(x=>x.id!==activeId);if(!pool.length)return;const pick=pool[Math.floor(Math.random()*pool.length)];activeId=pick.id;localStorage.setItem(storageKey,activeId);render();renderList()});
  $('#search').addEventListener('input',renderList);
  document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{activeType=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderList()}));
  render();renderList();
 }catch(error){console.error(error);showLoadError()}
}
init();
</script>
</body></html>
