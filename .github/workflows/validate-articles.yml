name: Validate article data

on:
  push:
    branches:
      - main
    paths:
      - 'data/articles/**'
      - 'scripts/validate-articles.mjs'
      - '.github/workflows/validate-articles.yml'
  pull_request:
    paths:
      - 'data/articles/**'
      - 'scripts/validate-articles.mjs'
      - '.github/workflows/validate-articles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate article data
        run: node scripts/validate-articles.mjs
